schema_version: 1

context:
  name: aiostream
  version: "0.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aiostream-${{ version }}.tar.gz
  sha256: 272aaa0d8f83beb906f5aa9022bb59046bb7a103fa3770f807c31f918595acf6

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - aiostream
        - aiostream.stream
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Generator-based operators for asynchronous iteration
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/vxgmichel/aiostream

extra:
  recipe-maintainers:
    - ian-r-rose
    - shughes-uk
    - timkpaine
    - vxgmichel
